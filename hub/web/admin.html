<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi admin</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 0 auto; padding: 16px; }
  input, button { font: inherit; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid; width: 100%; box-sizing: border-box; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
  dt { opacity: .7; } dd { margin: 0; text-align: right; }
  .err { color: #c00; }
  .warn { border: 1px solid #c60; border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .svc { border: 1px solid; border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .svc small { opacity: .7; display: block; }
  .row { display: flex; gap: 8px; } .row button { width: auto; flex: 1; }
</style>
</head>
<body>
<h1>Pi admin</h1>
<form id="login" hidden>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
  <button>Log in</button>
  <p class="err" id="err"></p>
</form>
<div id="main" hidden>
  <div id="warnings"></div>
  <dl id="stats"></dl>
  <h2>Services</h2>
  <div id="services"></div>
  <h2>Wi-Fi</h2>
  <dl id="wifi"></dl>
  <div id="keep" class="warn" hidden>
    <p id="keeptext"></p>
    <button id="keepbtn">Keep this network</button>
  </div>
  <h3>Saved networks</h3>
  <div id="saved"></div>
  <h3>Nearby networks</h3>
  <button id="scanbtn">Scan</button>
  <div id="nearby"></div>
  <h3>Add a network</h3>
  <form id="add">
    <input name="ssid" placeholder="Network name (SSID)" maxlength="32" required>
    <input name="password" type="password" placeholder="Password (empty for an open network)" autocomplete="off">
    <button>Save network</button>
  </form>
  <button data-power="reboot">Reboot</button>
  <button data-power="poweroff">Power off</button>
  <p id="msg"></p>
</div>
<p><a href="/">Services</a></p>
<script>
const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method: 'POST', body});
let services = [];
const text = (tag, t, cls) => { const e = document.createElement(tag); e.textContent = t; if (cls) e.className = cls; return e; };
async function loadServices() {
  const r = await fetch('/admin/api/services');
  if (!r.ok) return;
  const d = await r.json();
  services = d.services;
  $('warnings').replaceChildren(...d.warnings.map(w => text('div', w.message, 'warn')));
  $('services').replaceChildren(...services.map(s => {
    const box = text('div', '', 'svc');
    const mem = s.memory_bytes == null ? 'n/a' : Math.round(s.memory_bytes / 1048576) + ' MB';
    box.append(text('strong', s.name + (s.running ? ' (running)' : ' (stopped)')),
      text('small', s.class + ' · memory ' + mem + ' · ' + s.units.map(u => u.unit + ': ' + u.state).join(', ')));
    if (s.class === 'exclusive') {
      const b = text('button', s.running ? 'Switch off ' + s.name : 'Switch to ' + s.name);
      b.onclick = () => (s.running ? ask('stop', s) : ask('switch', s));
      box.append(b);
    }
    return box;
  }));
}
// The dialog names what stops and what starts; the server only runs it with the nonce from step one.
async function ask(verb, s) {
  const stops = services.filter(o => o.class === 'exclusive' && o.running && (verb === 'stop' || o.id !== s.id));
  const names = stops.map(o => o.name).join(', ');
  const q = verb === 'stop' ? 'Stop ' + s.name + '?' :
    (names ? 'Stop ' + names + ' and start ' + s.name + '?' : 'Start ' + s.name + '?');
  if (!confirm(q)) return;
  const url = '/admin/api/' + verb, id = s.id;
  const {nonce} = await (await post(url, JSON.stringify({id}))).json();
  const r = await post(url, JSON.stringify({id, nonce}));
  $('msg').textContent = r.ok ? 'Done.' : 'Failed: ' + await r.text();
  loadServices();
}
// Wi-Fi. Every change is two calls: the first returns a nonce, the second runs it.
async function wifiCall(op, body, question) {
  if (!confirm(question)) return null;
  const url = '/admin/api/wifi/' + op;
  const one = await post(url, JSON.stringify(body));
  if (!one.ok) { $('msg').textContent = 'Failed: ' + await one.text(); return null; }
  const {nonce} = await one.json();
  const r = await post(url, JSON.stringify({...body, nonce}));
  if (!r.ok) { $('msg').textContent = 'Failed: ' + await r.text(); return null; }
  return r.status === 204 ? {} : r.json();
}
let wifiKnown = {};
async function loadWifi() {
  const r = await fetch('/admin/api/wifi');
  if (!r.ok) return;
  const d = await r.json();
  wifiKnown = d;
  const rows = {Mode: d.mode === 'hotspot' ? 'Pi hotspot (no internet)' : d.mode === 'client' ? 'Connected to a network' : 'Not connected',
    Network: d.ssid || 'none', Address: d.ip ? d.ip + ' / ' + d.hostname : d.hostname,
    'Hotspot fallback': d.fallback_timer === 'active' ? 'watching' : 'NOT RUNNING (' + d.fallback_timer + ')'};
  $('wifi').replaceChildren(...Object.entries(rows).flatMap(([k, v]) => [text('dt', k), text('dd', v)]));
  $('saved').replaceChildren(...d.saved.map(n => {
    const box = text('div', '', 'svc');
    box.append(text('strong', n.name + (n.active ? ' (in use)' : n.hotspot ? ' (hotspot)' : '')), text('small', n.ssid));
    if (!n.active && !n.hotspot) {
      const row = text('div', '', 'row');
      const go = text('button', 'Connect');
      go.onclick = () => connectTo(n.name);
      const del = text('button', 'Forget');
      del.onclick = async () => { if (await wifiCall('forget', {name: n.name}, 'Forget ' + n.name + '?')) loadWifi(); };
      row.append(go, del); box.append(row);
    }
    return box;
  }));
  $('keep').hidden = !d.revert_armed;
  if (d.revert_armed) $('keeptext').textContent = 'A network switch is waiting. If you can read this at the new address, keep it; otherwise the previous network returns by itself within ' + d.revert_seconds + ' s.';
  if (d.mode === 'hotspot') $('nearby').replaceChildren(text('p', 'Scanning is off in hotspot mode because it would drop the hotspot. Enter the network name by hand below.'));
}
async function scan() {
  const r = await fetch('/admin/api/wifi/scan');
  if (!r.ok) { $('nearby').replaceChildren(text('p', r.status === 409 ? await r.text() : 'Scan failed: ' + await r.text())); return; }
  const {networks} = await r.json();
  $('nearby').replaceChildren(...networks.map(n => {
    const b = text('button', n.ssid + ' · ' + n.signal + '%' + (n.security ? ' · ' + n.security : ' · open'));
    b.onclick = () => { $('add').ssid.value = n.ssid; $('add').password.focus(); };
    return b;
  }));
}
async function connectTo(name) {
  const prev = wifiKnown.ssid || 'the current network';
  const res = await wifiCall('connect', {name}, 'Switch Wi-Fi to ' + name + '? This page may disconnect. Unless you press Keep within ' + wifiKnown.revert_seconds + ' s, the Pi goes back to ' + prev + '.');
  if (!res) return;
  $('msg').textContent = 'Switched. Open http://' + (res.ip || res.hostname) + '/admin and press Keep this network' + (res.ip ? ' (also ' + res.hostname + ')' : '') + '.';
  loadWifi();
}
$('keepbtn').onclick = async () => {
  if (await wifiCall('keep', {}, 'Keep this network?')) { $('msg').textContent = 'Kept.'; loadWifi(); }
};
$('add').onsubmit = async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  if (await wifiCall('add', body, 'Save ' + body.ssid + '?')) { e.target.reset(); $('msg').textContent = 'Saved. Use Connect to switch to it.'; loadWifi(); }
};
async function refresh() {
  const r = await fetch('/admin/api/stats');
  $('login').hidden = r.ok; $('main').hidden = !r.ok;
  if (!r.ok) return;
  loadServices(); loadWifi();
  const s = await r.json();
  const gb = b => (b / 1e9).toFixed(1) + ' GB', mb = k => Math.round(k / 1024) + ' MB';
  const up = Math.floor(s.uptime_s / 60);
  const rows = {Load: s.load1.toFixed(2), Temperature: s.temp_c.toFixed(1) + ' °C',
    Memory: mb(s.mem_available_kb) + ' free of ' + mb(s.mem_total_kb),
    Disk: gb(s.disk_free) + ' free of ' + gb(s.disk_total),
    Uptime: Math.floor(up / 1440) + ' d ' + Math.floor(up % 1440 / 60) + ' h ' + up % 60 + ' min'};
  $('stats').replaceChildren(...Object.entries(rows).flatMap(([k, v]) => {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v; return [dt, dd];
  }));
}
$('login').onsubmit = async e => {
  e.preventDefault();
  const r = await post('/admin/api/login', new URLSearchParams(new FormData(e.target)));
  $('err').textContent = r.ok ? '' : (r.status == 429 ? 'Too many attempts, wait a minute.' : 'Wrong password.');
  e.target.reset(); refresh();
};
document.querySelectorAll('[data-power]').forEach(b => b.onclick = async () => {
  const action = b.dataset.power;
  if (!confirm(action === 'reboot' ? 'Reboot the Pi?' : 'Power off the Pi? It will need to be unplugged to start again.')) return;
  const {nonce} = await (await post('/admin/api/power', JSON.stringify({action}))).json();
  const r = await post('/admin/api/power', JSON.stringify({action, nonce}));
  $('msg').textContent = r.ok ? 'Done. The Pi is going down.' : 'Failed: ' + await r.text();
});
refresh(); setInterval(refresh, 5000);
$('scanbtn').onclick = scan;
</script>
</body>
</html>
